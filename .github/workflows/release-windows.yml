name: Release - Windows package

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run packaging script
        shell: pwsh
        run: |
          pwsh -File .\\scripts\\ci\\package_deploy.ps1

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: 'Windows deploy package'
          # Use a PAT with repo permissions when greater privileges are required
          token: ${{ secrets.PUBLISH_PAT }}
          draft: false
          prerelease: false

      # ensure the artifact exists before attempting upload
      - name: Check deploy artifact
        shell: pwsh
        run: |
          if (-not (Test-Path './deploy/deploy_package.zip')) {
            Write-Error "deploy/deploy_package.zip not found"
            exit 1
          }
          Write-Output "deploy artifact exists"

      - name: Upload deploy zip to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./deploy/deploy_package.zip
          asset_name: deploy_package.zip
          asset_content_type: application/zip
