name: Release - Windows package

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run packaging script
        shell: pwsh
        run: |
          pwsh -File .\\scripts\\ci\\package_deploy.ps1

      # verify the artifact before publishing, so a packaging failure does not
      # leave an empty release behind
      - name: Check deploy artifact
        shell: pwsh
        run: |
          if (-not (Test-Path './deploy/deploy_package.zip')) {
            Write-Error "deploy/deploy_package.zip not found"
            exit 1
          }
          Write-Output "deploy artifact exists"

      # Creates the release and uploads the asset in one step.
      #
      # PUBLISH_PAT rather than the built-in token: a release published with
      # GITHUB_TOKEN does not trigger other workflows, which would leave
      # deploy-via-ssh.yml (on: release: published) never firing. The
      # contents: write permission above applies only to the built-in token
      # and is kept as a fallback for swapping back to ${{ github.token }}.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: 'Windows deploy package'
          draft: false
          prerelease: false
          files: ./deploy/deploy_package.zip
          token: ${{ secrets.PUBLISH_PAT }}
