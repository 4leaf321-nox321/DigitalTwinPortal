name: Auto-tag on version bump

# frontend/package.json 의 version 이 바뀌어 main 에 올라오면 그 버전으로
# 태그(vX.Y.Z)를 만들어 push 한다. 그 태그 push 가 release-windows.yml
# (on: push tags: 'v*') 을 깨워 패키지 빌드 + GitHub Release 발행까지 이어진다.
#
# 즉 배포 결정 = package.json 의 version 을 올리는 것. 손으로 git tag 를 칠
# 일이 없다. 버전을 올리지 않은 커밋은 아무 릴리스도 만들지 않는다.
#
# ⚠️ 태그를 기본 GITHUB_TOKEN 으로 push 하면 다른 워크플로(release-windows)가
#    재트리거되지 않는다(GitHub 의 재귀 방지). 그래서 contents:write 권한의
#    PAT 인 PUBLISH_PAT 으로 push 한다. 릴리스 발행에 쓰는 것과 같은 시크릿이다.
#    시크릿이 없으면 경고만 남기고 건너뛴다(빨간 실패가 아니다).
on:
  push:
    branches: [main]
    paths: ['frontend/package.json']

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Check out with the PAT so its credentials are persisted for the push
      # below. Embedding the token in the remote URL as x-access-token is a
      # GitHub App form and a PAT is refused with 403.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create & push tag
        env:
          RELEASE_PAT: ${{ secrets.PUBLISH_PAT }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::frontend/package.json 의 version 이 semver 가 아닙니다: ${VERSION}"
            exit 1
          fi
          # 의존성만 바뀌어도 이 워크플로가 도니, 같은 버전이면 조용히 넘어간다.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Tag ${TAG} already exists on origin — nothing to do."
            exit 0
          fi
          if [ -z "${RELEASE_PAT}" ]; then
            echo "::warning::PUBLISH_PAT 시크릿이 없어 자동 태그를 건너뜁니다. 설정하면 릴리스까지 자동 연결됩니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG} — release-windows.yml 이 패키지를 만들고 Release 를 발행합니다."
