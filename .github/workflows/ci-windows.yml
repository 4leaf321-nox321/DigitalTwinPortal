name: CI - Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # DB 가 필요한 테스트는 리눅스에서 돈다.
  #
  # Windows 러너에는 Postgres 가 없고, GitHub Actions 의 `services:` 컨테이너도
  # 리눅스에서만 쓸 수 있다. 백엔드는 순수 파이썬이라 테스트를 리눅스에서 돌려도
  # 검증력이 같다 — **패키징만 Windows 에서 하면 된다**(아래 build 잡).
  #
  # 이 잡이 없으면 backend\tests 가 있어도 CI 에서 한 번도 안 돈다.
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dxdigitaltwin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dxdigitaltwin_test
      # create_app() 이 요구하는 값들. 테스트 설정이 DB URI 는 따로 잡는다.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dxdigitaltwin_test
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check model mappings
        run: python backend/scripts/check_models.py

      - name: Run tests
        run: python -m pytest backend/tests -q -p no:warnings

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # ⚠️ 20 이어야 한다. `node --test` 가 18 에서는 실험 단계다.
          node-version: '20'
          # 러너마다 node_modules 를 처음부터 받으면 1분 넘게 쓴다.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Backend: create venv and install deps"
        shell: pwsh
        run: |
          python -m venv backend\.venv
          .\backend\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          if (Test-Path backend\requirements.txt) { pip install -r backend\requirements.txt }

      # DB 가 필요 없는 검사다. 모델을 고쳤는데 질의를 한 번도 안 해보면
      # 매퍼가 깨진 채로 릴리스까지 나간다 — 2026-08-15 에 실제로 그랬다.
      # 마이그레이션 생성·적용도, 표 존재 확인도 매퍼를 완전히 설정하지 않는다.
      - name: "Backend: check model mappings"
        shell: pwsh
        run: |
          .\backend\.venv\Scripts\Activate.ps1
          python backend\scripts\check_models.py
          if ($LASTEXITCODE -ne 0) { throw "model mapping check failed (exit $LASTEXITCODE)" }

      # pytest 는 여기서 돌지 않는다. Postgres 가 필요하고 Windows 러너에는
      # 없다 — 위의 backend-tests 잡(ubuntu + postgres 서비스)이 담당한다.
      # 이 잡은 **Windows 에서만 확인할 수 있는 것**에 집중한다: 의존성 설치,
      # 프론트 빌드, wheel 묶음 만들기.

      # 빌드는 이 부류를 **못 잡는다.** 정의되지 않은 이름은 빌드 오류가 아니라
      # 실행 오류이고(0.4.2 — KPI 화면이 진입 즉시 죽은 채로 세 릴리스가 나갔다),
      # useMemo 의존성 누락은 문법이 멀쩡한 채 **틀린 값만 조용히** 낸다
      # (0.5.0 — 전체 카드가 낡은 값을 붙들고 있었다).
      #
      # ESLint 와 플러그인은 처음부터 devDependencies 에 있었는데 설정 파일이
      # 없어서 한 번도 안 돌았다. 그 빈자리로 같은 사고가 세 번 났다.
      #
      # ⚠️ `--max-warnings` 는 **래칫**이다. exhaustive-deps 경고가 지금 121건
      #    있는데, 한꺼번에 고치면 손댈 파일이 59개라 사고가 더 난다. 그래서
      #    지금 수를 천장으로 박아 **늘어나는 것만 막는다.** 줄이면 그때 이 수도
      #    같이 내릴 것. 절대 올리지 말 것 — 올리는 순간 검사는 있으나 마나가 된다.
      - name: "Frontend: install"
        shell: pwsh
        run: |
          if (Test-Path frontend\package.json) {
            Push-Location frontend
            # pwsh does not halt on native command failure; check explicitly so
            # the real error surfaces instead of a misleading downstream one.
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed (exit $LASTEXITCODE)" }
            Pop-Location
          }

      # ⚠️ lint 를 build **앞에** 둔다. 빌드는 2분 걸리는데 lint 는 몇 초다.
      #    없는 이름을 부른 것은 어차피 빌드를 통과하므로, 먼저 걸러 내는 편이
      #    실패를 빨리 알려 준다.
      - name: "Frontend: lint"
        shell: pwsh
        run: |
          if (Test-Path frontend\package.json) {
            Push-Location frontend
            npm run lint
            if ($LASTEXITCODE -ne 0) { throw "lint failed (exit $LASTEXITCODE)" }
            Pop-Location
          }

      # 빌드도 lint 도 **계산이 틀리는 것**은 못 잡는다. 문법이 멀쩡하고 이름도
      # 다 있는데 숫자만 조용히 다르다 — 0.4.3ㆍ0.5.0 이 그랬다. 그건 시험만 잡는다.
      #
      # 새 패키지를 안 쓴다. node 에 들어 있는 시험 얼개(node:test)를 쓰고,
      # 확장자 없는 import 만 test/resolver.mjs 가 풀어 준다.
      - name: "Frontend: test"
        shell: pwsh
        run: |
          if (Test-Path frontend\package.json) {
            Push-Location frontend
            npm test
            if ($LASTEXITCODE -ne 0) { throw "tests failed (exit $LASTEXITCODE)" }
            Pop-Location
          }

      - name: "Frontend: build"
        id: frontend-build
        shell: pwsh
        env:
          # ~4.3k modules exhaust Node's default ~2GB heap while rendering
          # chunks; the runner has 16GB, so raise the limit.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if (Test-Path frontend\package.json) {
            Push-Location frontend
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "npm run build failed (exit $LASTEXITCODE)" }
            Pop-Location
            if (Test-Path frontend\dist) {
              echo "dist_exists=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "dist_exists=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            Write-Host 'No frontend project found, skipping.'
            echo "dist_exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create artifacts dir
        shell: pwsh
        run: mkdir artifacts

      - name: Package backend wheels
        id: package-backend
        shell: pwsh
        run: |
          .\backend\.venv\Scripts\Activate.ps1
          if (Test-Path backend\requirements.txt) {
            python -m pip wheel -r backend\requirements.txt -w artifacts || Write-Host 'Wheel build failed or no requirements.'
          } else {
            Write-Host 'No backend requirements.txt; skipping wheel build.'
          }
          if (Test-Path artifacts) { echo "artifacts_exist=true" >> $env:GITHUB_OUTPUT } else { echo "artifacts_exist=false" >> $env:GITHUB_OUTPUT }

      - name: Upload frontend dist
        if: steps.frontend-build.outputs.dist_exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend\dist

      - name: Upload backend artifacts
        if: steps.package-backend.outputs.artifacts_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts
          path: artifacts

  # ───────────────────────────────────────────────────────────────────────────
  # 버전이 올라갔으면 태그를 만든다 — **시험과 빌드가 통과한 뒤에만.**
  #
  # ⚠️⚠️ 예전에는 이것이 `auto-tag.yml` 이라는 **별도 워크플로**였다. 같은 push 에
  #    CI 와 **나란히** 돌았고 서로를 안 봐서, **시험이 빨간 채로 릴리스가 나갔다.**
  #    v0.7.2 와 v0.8.1 이 그렇게 나갔다(둘 다 나간 뒤에 알았다).
  #    `needs:` 로 묶어야 진짜 순서가 생긴다 — 워크플로가 둘이면 순서를 못 준다.
  #
  # ⚠️ **비상구는 그대로 있다.** `release-windows.yml` 은 태그 push 로 깨어나므로,
  #    급하면 사람이 손으로 `git tag vX.Y.Z && git push origin vX.Y.Z` 하면 CI 와
  #    무관하게 패키지가 나간다. 자동 경로만 막고 수동 경로는 열어 둔다 —
  #    막힌 문은 반드시 누군가 부수기 때문에, 부술 문을 미리 만들어 둔다.
  #
  # 배포 결정 = `frontend/package.json` 의 version 을 올리는 것. 버전이 그대로면
  # 태그가 이미 있어 조용히 넘어간다(`paths:` 필터 대신 그 idempotency 를 쓴다 —
  # `needs:` 를 쓰려면 같은 워크플로여야 하고, 잡에는 paths 필터가 없다).
  tag:
    needs: [backend-tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 아래 push 에 쓰도록 PAT 로 체크아웃해 자격을 남긴다. 원격 URL 에
      # x-access-token 으로 박는 형식은 GitHub App 용이라 PAT 는 403 이 난다.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create & push tag
        env:
          RELEASE_PAT: ${{ secrets.PUBLISH_PAT }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::frontend/package.json 의 version 이 semver 가 아닙니다: ${VERSION}"
            exit 1
          fi
          # 버전을 안 올린 커밋이 대부분이다. 태그가 이미 있으면 할 일이 없다.
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Tag ${TAG} already exists on origin — nothing to do."
            exit 0
          fi
          if [ -z "${RELEASE_PAT}" ]; then
            echo "::warning::PUBLISH_PAT 시크릿이 없어 자동 태그를 건너뜁니다."
            exit 0
          fi
          # ⚠️ 기본 GITHUB_TOKEN 으로 태그를 밀면 다른 워크플로가 재트리거되지
          #    않는다(GitHub 의 재귀 방지). 그래서 PAT 로 민다.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG} — release-windows.yml 이 패키지를 만들고 Release 를 발행합니다."
