name: CI - Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # DB 가 필요한 테스트는 리눅스에서 돈다.
  #
  # Windows 러너에는 Postgres 가 없고, GitHub Actions 의 `services:` 컨테이너도
  # 리눅스에서만 쓸 수 있다. 백엔드는 순수 파이썬이라 테스트를 리눅스에서 돌려도
  # 검증력이 같다 — **패키징만 Windows 에서 하면 된다**(아래 build 잡).
  #
  # 이 잡이 없으면 backend\tests 가 있어도 CI 에서 한 번도 안 돈다.
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dxdigitaltwin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dxdigitaltwin_test
      # create_app() 이 요구하는 값들. 테스트 설정이 DB URI 는 따로 잡는다.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dxdigitaltwin_test
      SECRET_KEY: ci-secret
      JWT_SECRET_KEY: ci-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Check model mappings
        run: python backend/scripts/check_models.py

      - name: Run tests
        run: python -m pytest backend/tests -q -p no:warnings

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: "Backend: create venv and install deps"
        shell: pwsh
        run: |
          python -m venv backend\.venv
          .\backend\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          if (Test-Path backend\requirements.txt) { pip install -r backend\requirements.txt }

      # DB 가 필요 없는 검사다. 모델을 고쳤는데 질의를 한 번도 안 해보면
      # 매퍼가 깨진 채로 릴리스까지 나간다 — 2026-08-15 에 실제로 그랬다.
      # 마이그레이션 생성·적용도, 표 존재 확인도 매퍼를 완전히 설정하지 않는다.
      - name: "Backend: check model mappings"
        shell: pwsh
        run: |
          .\backend\.venv\Scripts\Activate.ps1
          python backend\scripts\check_models.py
          if ($LASTEXITCODE -ne 0) { throw "model mapping check failed (exit $LASTEXITCODE)" }

      # pytest 는 여기서 돌지 않는다. Postgres 가 필요하고 Windows 러너에는
      # 없다 — 위의 backend-tests 잡(ubuntu + postgres 서비스)이 담당한다.
      # 이 잡은 **Windows 에서만 확인할 수 있는 것**에 집중한다: 의존성 설치,
      # 프론트 빌드, wheel 묶음 만들기.

      - name: "Frontend: install and build"
        id: frontend-build
        shell: pwsh
        env:
          # ~4.3k modules exhaust Node's default ~2GB heap while rendering
          # chunks; the runner has 16GB, so raise the limit.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if (Test-Path frontend\package.json) {
            Push-Location frontend
            # pwsh does not halt on native command failure; check explicitly so
            # the real error surfaces instead of a misleading downstream one.
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed (exit $LASTEXITCODE)" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "npm run build failed (exit $LASTEXITCODE)" }
            Pop-Location
            if (Test-Path frontend\dist) {
              echo "dist_exists=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "dist_exists=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            Write-Host 'No frontend project found, skipping.'
            echo "dist_exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create artifacts dir
        shell: pwsh
        run: mkdir artifacts

      - name: Package backend wheels
        id: package-backend
        shell: pwsh
        run: |
          .\backend\.venv\Scripts\Activate.ps1
          if (Test-Path backend\requirements.txt) {
            python -m pip wheel -r backend\requirements.txt -w artifacts || Write-Host 'Wheel build failed or no requirements.'
          } else {
            Write-Host 'No backend requirements.txt; skipping wheel build.'
          }
          if (Test-Path artifacts) { echo "artifacts_exist=true" >> $env:GITHUB_OUTPUT } else { echo "artifacts_exist=false" >> $env:GITHUB_OUTPUT }

      - name: Upload frontend dist
        if: steps.frontend-build.outputs.dist_exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend\dist

      - name: Upload backend artifacts
        if: steps.package-backend.outputs.artifacts_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts
          path: artifacts
